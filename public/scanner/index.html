<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kya Secur</title>
    <link rel="stylesheet" href="/scanner/style.css" />
</head>

<body>
    <main class="app">
        <header class="app-header">
            <h1 id="title">Kya Secur</h1>
            <p id="subtitle" class="subtitle">Étape 1 — Scannez votre QR code</p>
        </header>

        <!-- Indicateur d'étapes -->
        <div class="steps">
            <span class="step active" data-step="qr">1. QR Code</span>
            <span class="step" data-step="face">2. Visage</span>
        </div>

        <!-- ZONE SCAN QR -->
        <section id="stage-qr" class="stage active">
            <div class="scanner-frame">
                <div id="qr-reader" class="reader"></div>
                <div class="scan-line"></div>
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
            <p class="hint">Placez le QR code dans le cadre</p>

            <!-- Outils pour faciliter le scan -->
            <div class="tools">
                <button id="torch-btn" class="tool-btn hidden" title="Lampe torche">
                    <span class="tool-ico">🔦</span><span>Flash</span>
                </button>
                <button id="switch-cam-btn" class="tool-btn hidden" title="Changer de caméra">
                    <span class="tool-ico">🔄</span><span>Caméra</span>
                </button>
            </div>
        </section>

        <!-- ZONE SCAN VISAGE -->
        <section id="stage-face" class="stage">
            <div class="scanner-frame round">
                <video id="face-video" class="reader" autoplay playsinline muted></video>
                <div class="scan-line"></div>
                <div class="face-guide"></div>
            </div>
            <p id="face-hint" class="hint">Centrez votre visage, la détection est automatique</p>
        </section>

        <!-- OVERLAY RESULTAT (coche / croix) -->
        <div id="result-overlay" class="result-overlay">
            <div class="result-icon">
                <svg class="icon-check" viewBox="0 0 52 52">
                    <circle cx="26" cy="26" r="24" fill="none" />
                    <path fill="none" d="M14 27 l8 8 l16 -18" />
                </svg>
                <svg class="icon-cross" viewBox="0 0 52 52">
                    <circle cx="26" cy="26" r="24" fill="none" />
                    <path fill="none" d="M17 17 L35 35 M35 17 L17 35" />
                </svg>
            </div>
            <p id="result-text" class="result-text"></p>
        </div>

        <canvas id="capture-canvas" class="hidden"></canvas>
    </main>

    <!-- Librairie de scan QR -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Librairie de détection de visage (repli si le navigateur n'a pas FaceDetector natif) -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.min.js"></script>
    <script src="/scanner/config.js"></script>
    <script src="/scanner/app.js"></script>
</body>

</html>
